<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<header class="hero">
    <div class="container">
        <h1 class="display-5 fw-bold">Everything for your desk, in one fictional shop</h1>
        <p class="lead mb-4">Headphones, keyboards, chargers and more. All products and customers on this site are made up.</p>
        <a class="btn btn-warning btn-lg" th:href="@{/products}">Browse all products</a>
    </div>
</header>

<main class="container py-4">
    <h2 class="h4 mb-3">Featured products</h2>
    <div class="row g-4">
        <div class="col-6 col-lg-3" th:each="p : ${products}">
            <div class="card product-card h-100">
                <div class="product-icon" th:text="${p.icon}">📦</div>
                <div class="card-body d-flex flex-column">
                    <h3 class="h6 card-title" th:text="${p.name}">Name</h3>
                    <p class="card-text text-muted small" th:text="${#strings.abbreviate(p.description, 70)}">Description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="price" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</span>
                        <a class="btn btn-sm btn-primary" th:href="@{/products/{id}(id=${p.id})}">View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
