<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <h1 class="h3 mb-4">Administrator dashboard</h1>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card stat-card"><div class="card-body">
                <div class="text-muted small">Registered users</div>
                <div class="fs-2 fw-bold" th:text="${userCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card"><div class="card-body">
                <div class="text-muted small">Products</div>
                <div class="fs-2 fw-bold" th:text="${productCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card"><div class="card-body">
                <div class="text-muted small">Orders</div>
                <div class="fs-2 fw-bold" th:text="${orderCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card"><div class="card-body">
                <div class="text-muted small">Revenue</div>
                <div class="fs-2 fw-bold" th:text="'$' + ${#numbers.formatDecimal(revenue, 1, 2)}">$0.00</div>
            </div></div>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" th:href="@{/admin/users}">Manage users</a>
        <a class="btn btn-primary" th:href="@{/admin/products}">Manage products</a>
        <a class="btn btn-primary" th:href="@{/admin/orders}">View all orders</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
