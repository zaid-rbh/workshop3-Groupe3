<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4" style="max-width: 680px;">
    <a class="small" th:href="@{/admin/products}">&larr; Back to products</a>
    <h1 class="h3 my-2" th:text="${product.id == null} ? 'Add a product' : 'Edit product'">Product</h1>

    <form th:action="@{/admin/products/save}" method="post" class="card card-body">
        <input type="hidden" name="id" th:value="${product.id}">
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" th:value="${product.name}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" th:text="${product.description}"></textarea>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="price">Price</label>
                <input class="form-control" id="price" name="price" type="number" step="0.01" th:value="${product.price}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="stock">Stock</label>
                <input class="form-control" id="stock" name="stock" type="number" th:value="${product.stock}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="icon">Icon (emoji)</label>
                <input class="form-control" id="icon" name="icon" th:value="${product.icon}">
            </div>
        </div>
        <button class="btn btn-primary align-self-start" type="submit">Save product</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
