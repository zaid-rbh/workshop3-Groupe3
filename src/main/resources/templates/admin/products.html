<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <a class="small" th:href="@{/admin}">&larr; Dashboard</a>
    <div class="d-flex justify-content-between align-items-center my-2">
        <h1 class="h3 m-0">Products</h1>
        <a class="btn btn-primary" th:href="@{/admin/products/new}">Add a product</a>
    </div>

    <div class="table-responsive">
        <table class="table align-middle">
            <thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}">1</td>
                <td><span th:text="${p.icon}">📦</span> <span th:text="${p.name}">Name</span></td>
                <td th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</td>
                <td th:text="${p.stock}">0</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/products/edit/{id}(id=${p.id})}">Edit</a>
                    <a class="btn btn-sm btn-outline-danger" data-confirm="Delete this product?"
                       th:href="@{/admin/products/delete/{id}(id=${p.id})}">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
