<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 460px;">
    <h1 class="h3 mb-4">Log in</h1>

    <div class="alert alert-success" th:if="${param.registered != null}">Account created. You can now log in.</div>
    <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'nouser'}">This username does not exist.</div>
    <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'badpassword'}">Wrong password for this username.</div>

    <form th:action="@{/login}" method="post" class="card card-body">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password">
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>

    <p class="mt-3 text-muted small">
        Demo accounts (fictional): admin / admin123, alice / alice123, bob / 123456, charlie / qwerty.
    </p>
    <p class="small">No account yet? <a th:href="@{/register}">Register</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
