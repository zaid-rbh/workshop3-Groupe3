<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 m-0">Products</h1>
        <form class="d-flex gap-2" th:action="@{/products}" method="get">
            <input class="form-control" type="search" name="q" th:value="${query}" placeholder="Search by name or description">
            <select class="form-select" name="sort">
                <option value="name" th:selected="${sort == 'name'}">Name</option>
                <option value="price" th:selected="${sort == 'price'}">Price</option>
                <option value="stock" th:selected="${sort == 'stock'}">Stock</option>
            </select>
            <button class="btn btn-primary" type="submit">Search</button>
        </form>
    </div>

    <!-- VULNERABILITY #14: reflected XSS. th:utext prints the search term WITHOUT escaping it. -->
    <p class="text-muted" th:if="${query != null and !query.isEmpty()}">
        Results for: <strong th:utext="${query}">term</strong>
        (<span th:text="${#lists.size(products)}">0</span> found)
    </p>

    <div class="alert alert-info" th:if="${#lists.isEmpty(products)}">
        No product matches your search. Try another keyword.
    </div>

    <div class="row g-4">
        <div class="col-6 col-lg-3" th:each="p : ${products}">
            <div class="card product-card h-100">
                <div class="product-icon" th:text="${p.icon}">📦</div>
                <div class="card-body d-flex flex-column">
                    <h2 class="h6 card-title" th:text="${p.name}">Name</h2>
                    <p class="card-text text-muted small" th:text="${#strings.abbreviate(p.description, 70)}">Description</p>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="price" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}">$0.00</span>
                        <a class="btn btn-sm btn-primary" th:href="@{/products/{id}(id=${p.id})}">View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
