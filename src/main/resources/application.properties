# ==========================================================================
# VulnerableShop - INTENTIONALLY VULNERABLE configuration (educational use)
# ==========================================================================
spring.application.name=DevSecOps-project
server.port=8080

# SAFETY GUARD: the server only listens on the local machine.
# Do NOT change this and do NOT deploy this application publicly.
server.address=127.0.0.1

# --- Database (H2 stored in the ./data folder; delete the folder to reset) ---
spring.datasource.url=jdbc:h2:file:./data/vulnshop
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# VULNERABILITY #24: debug-oriented defaults (H2 console enabled, SQL printed in logs)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.thymeleaf.cache=false

# VULNERABILITY #17: detailed error information sent to the browser
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

# VULNERABILITY #6: insecure session cookie and very long session lifetime
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=24h

# VULNERABILITY #21: no realistic upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Folder used by the (intentionally unsafe) upload demonstration
app.upload-dir=uploads
